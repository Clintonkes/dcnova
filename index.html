<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <script>document.documentElement.classList.add("js");</script>
    <script>
      // public/404.html encodes deep links as ?/path; restore the real URL
      // before React Router mounts so refreshes on inner pages work.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
